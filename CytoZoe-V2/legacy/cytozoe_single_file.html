<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CytoZoe</title>
<style>/* CytoZoe design tokens and components. Tokens come from Design MD1 section 4. */
:root {
  --canvas:#F4F6F8; --surface:#FFFFFF; --nav:#102236; --nav-text:#F8FAFC;
  --ink:#14283F; --muted:#526579; --border:#DCE4EB;
  --control-border:#728297; --primary:#087F8C;
  --primary-hover:#066873; --selected:#E8F5F5;
  --review:#9A4B08; --review-bg:#FFF3DF;
  --success:#216E4E; --success-bg:#EAF5EF;
  --error:#B42318; --error-bg:#FEF0EE; --focus:#2458D3; --baseline:#64748B;
  --radius:14px; --shadow:0 4px 16px rgb(16 34 54 / 5%);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink); background:var(--canvas);
}
* { box-sizing:border-box; }
html, body { margin:0; }
body { font-size:15px; line-height:23px; background:var(--canvas); color:var(--ink); }
h1, h2, h3, p { margin:0; }
h1 { font-size:30px; line-height:38px; font-weight:600; }
h2 { font-size:18px; line-height:26px; font-weight:600; }
h3 { font-size:15px; line-height:23px; font-weight:600; }
.metric-value { font-variant-numeric:tabular-nums; }
:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.muted { color:var(--muted); }
.small { font-size:13px; line-height:18px; }
.meta { font-size:12px; line-height:18px; color:var(--muted); }
code, .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; word-break:break-all; }

/* shell */
.app { display:grid; grid-template-columns:216px minmax(0,1fr); min-height:100vh; }
.rail { background:var(--nav); color:var(--nav-text); padding:24px 16px; display:flex; flex-direction:column; gap:24px; position:sticky; top:0; height:100vh; overflow:auto; }
.wordmark { font-size:20px; font-weight:600; letter-spacing:.01em; }
.wordmark small { display:block; font-size:12px; font-weight:400; opacity:.8; letter-spacing:0; line-height:18px; }
.nav { display:flex; flex-direction:column; gap:4px; }
.nav a { color:var(--nav-text); text-decoration:none; display:flex; align-items:center; gap:12px; min-height:44px; padding:8px 12px; border-radius:10px; font-size:15px; }
.nav a:hover { background:rgb(255 255 255 / 8%); }
.nav a[aria-current="page"] { background:rgb(255 255 255 / 14%); font-weight:600; }
.nav .num { width:24px; height:24px; border-radius:50%; border:1px solid rgb(248 250 252 / 55%); display:inline-grid; place-items:center; font-size:12px; flex:none; }
.nav a:focus-visible, .rail button:focus-visible { outline-color:#9CC0FF; }
.rail-foot { margin-top:auto; display:flex; flex-direction:column; gap:12px; font-size:13px; line-height:18px; }
.rail-foot .btn { background:transparent; color:var(--nav-text); border-color:rgb(248 250 252 / 55%); }
.rail-foot .btn:hover { background:rgb(255 255 255 / 10%); }
.main { padding:32px; min-width:0; }
.main-inner { max-width:1360px; margin:0 auto; display:flex; flex-direction:column; gap:24px; }
.topbar { display:flex; flex-wrap:wrap; gap:12px 24px; align-items:flex-start; justify-content:space-between; }
.topbar .lead { display:flex; flex-direction:column; gap:4px; min-width:0; }
.topbar .lead p { color:var(--muted); max-width:70ch; }
.chips { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.menu-btn { display:none; }

/* controls */
.btn, .field, select.field {
  min-height:44px; font:inherit; font-size:15px; border-radius:10px; padding:8px 14px;
  border:1px solid var(--control-border); background:var(--surface); color:var(--ink);
}
.btn { cursor:pointer; font-weight:600; transition:background 150ms; }
.btn:hover { background:var(--selected); }
.btn.primary { background:var(--primary); border-color:var(--primary); color:#fff; }
.btn.primary:hover { background:var(--primary-hover); }
.btn[disabled] { opacity:.55; cursor:not-allowed; }
.btn.small { min-height:44px; font-size:13px; }
.field { width:100%; }
textarea.field { min-height:96px; resize:vertical; line-height:22px; }
label.lbl { display:flex; flex-direction:column; gap:4px; font-size:13px; line-height:18px; font-weight:600; color:var(--ink); min-width:0; }
.row { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
.row > label.lbl { flex:1 1 180px; }

.badge { display:inline-flex; align-items:center; gap:6px; font-size:13px; line-height:18px; font-weight:600; padding:4px 10px; border-radius:999px; background:var(--selected); color:var(--primary-hover); border:1px solid transparent; }
.badge.review { background:var(--review-bg); color:var(--review); }
.badge.success { background:var(--success-bg); color:var(--success); }
.badge.error { background:var(--error-bg); color:var(--error); }
.badge.outline { background:var(--surface); color:var(--ink); border-color:var(--control-border); }
.status-neutral { color:var(--muted); font-size:13px; line-height:18px; }

/* surfaces */
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow); min-width:0; }
.card > h2 + * { margin-top:12px; }
.card-head { display:flex; flex-wrap:wrap; gap:8px 16px; justify-content:space-between; align-items:center; margin-bottom:12px; }
.grid-2-1 { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:24px; align-items:start; }
.grid-1-1 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; }
.markers { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; }
.marker { display:flex; flex-direction:column; gap:8px; padding:20px; }
.marker[aria-current="true"] { background:var(--selected); border-color:var(--primary); }
.marker .name { font-size:13px; line-height:18px; font-weight:600; color:var(--muted); }
.marker .val { font-size:30px; line-height:36px; font-weight:600; }
.marker .val small { font-size:13px; font-weight:400; color:var(--muted); margin-left:4px; }
.marker .actions { display:flex; gap:8px; margin-top:4px; flex-wrap:wrap; }
.summary { display:flex; flex-wrap:wrap; gap:12px 32px; }
.summary div { display:flex; flex-direction:column; }
.summary b { font-size:30px; line-height:36px; font-weight:600; }
.list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.list > li { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; justify-content:space-between; padding:14px 0; border-top:1px solid var(--border); }
.list > li:first-child { border-top:0; }
.banner { background:var(--review-bg); color:var(--review); border:1px solid #E9C58F; border-radius:12px; padding:12px 16px; font-weight:600; }
.notice { border-radius:12px; padding:12px 16px; font-size:14px; line-height:21px; }
.notice.error { background:var(--error-bg); color:var(--error); border:1px solid #F3B8B0; }
.notice.success { background:var(--success-bg); color:var(--success); border:1px solid #BFE0CF; }
.notice.info { background:var(--selected); color:var(--ink); border:1px solid var(--border); }
.empty { padding:24px; border:1px dashed var(--control-border); border-radius:12px; display:flex; flex-direction:column; gap:12px; background:var(--surface); }
.quality { display:flex; flex-wrap:wrap; gap:12px 32px; align-items:center; }
.quality div { display:flex; flex-direction:column; }
.quality b { font-size:22px; line-height:28px; font-weight:600; }

/* tabs */
.tabs { display:flex; flex-wrap:wrap; gap:8px; }
.tabs button { min-height:44px; padding:8px 16px; border-radius:10px; border:1px solid var(--control-border); background:var(--surface); font:inherit; font-weight:600; color:var(--ink); cursor:pointer; }
.tabs button[aria-selected="true"] { background:var(--primary); border-color:var(--primary); color:#fff; }

/* charts */
.chart { width:100%; }
.chart svg { display:block; max-width:100%; }
.chart text { font-family:inherit; fill:var(--muted); font-size:12px; }
.legend { display:flex; flex-wrap:wrap; gap:8px 20px; font-size:13px; line-height:18px; color:var(--muted); margin-top:8px; }
.legend span { display:inline-flex; align-items:center; gap:6px; }
.legend svg { flex:none; }
.pt:focus-visible { outline:none; }
.pt:focus-visible circle, .pt:focus-visible path { stroke:var(--focus); stroke-width:3; }
.readout { min-height:22px; font-size:13px; line-height:20px; color:var(--ink); margin-top:8px; }
details.tbl { margin-top:12px; }
details.tbl > summary { cursor:pointer; min-height:44px; display:flex; align-items:center; font-weight:600; color:var(--primary-hover); }
.table-wrap { overflow:auto; max-height:420px; border:1px solid var(--border); border-radius:10px; }
table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); font-size:13px; line-height:18px; white-space:nowrap; }
th { position:sticky; top:0; background:#F4F6F8; font-weight:600; color:var(--muted); z-index:1; }
tr[data-selected="true"] td { background:var(--selected); }
tr.click { cursor:pointer; }
tr.click:hover td { background:#F4F6F8; }

/* evidence */
.ev { display:flex; flex-direction:column; gap:16px; }
.ev section { display:flex; flex-direction:column; gap:6px; }
.ev h3 { font-size:13px; line-height:18px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; }
.ev .big { font-size:30px; line-height:36px; font-weight:600; }
.ev p, .ev li { font-size:14px; line-height:21px; }
.ev ul { margin:0; padding-left:18px; }
.assistant { display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--border); padding-top:16px; }
.assistant .asks { display:flex; flex-wrap:wrap; gap:8px; }
.answer { background:var(--selected); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; }
.answer p { font-size:14px; line-height:21px; }

/* drawer */
.scrim { position:fixed; inset:0; background:rgb(16 34 54 / 35%); z-index:40; }
.drawer { position:fixed; top:0; right:0; bottom:0; width:min(480px,100vw); background:var(--surface); z-index:50; box-shadow:-8px 0 32px rgb(16 34 54 / 15%); display:flex; flex-direction:column; transform:translateX(0); transition:transform 150ms; }
.drawer-head { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:20px 24px; border-bottom:1px solid var(--border); }
.drawer-body { padding:24px; overflow:auto; flex:1; }
[hidden] { display:none!important; }

/* responsive */
@media (max-width:1023px) {
  .app { grid-template-columns:72px minmax(0,1fr); }
  .rail { padding:16px 8px; align-items:center; }
  .wordmark small, .nav .label, .rail-foot .label, .rail-foot p { display:none; }
  .wordmark { font-size:16px; }
  .nav a { padding:8px; justify-content:center; }
  .main { padding:24px; }
  .grid-2-1, .grid-1-1 { grid-template-columns:minmax(0,1fr); }
}
@media (max-width:767px) {
  .app { grid-template-columns:minmax(0,1fr); }
  .rail { display:none; position:fixed; inset:0 auto 0 0; width:260px; z-index:60; height:100vh; align-items:stretch; padding:24px 16px; }
  .rail.open { display:flex; }
  .rail.open .nav .label, .rail.open .rail-foot .label, .rail.open .rail-foot p, .rail.open .wordmark small { display:inline; }
  .rail.open .nav a { justify-content:flex-start; }
  .menu-btn { display:inline-flex; align-items:center; }
  .main { padding:16px; }
  h1 { font-size:26px; line-height:32px; }
  .drawer { width:100vw; }
  .markers { grid-template-columns:minmax(0,1fr); }
}
/* keep wide tables inside their card: scroll the table, not the page */
.grid-2-1 > *, .grid-1-1 > *, .card, details.tbl { min-width:0; max-width:100%; }
.table-wrap { max-width:100%; }
p, .meta, .mono, .notice, .banner, h1, h2, h3, li, td { overflow-wrap:anywhere; }
/* accessibility helpers */
.skip { position:absolute; left:8px; top:-60px; z-index:100; background:var(--surface); color:var(--ink); padding:10px 14px; border-radius:8px; border:2px solid var(--focus); font-weight:600; }
.skip:focus { top:8px; }
.linkbtn { background:none; border:0; padding:6px 0; min-height:44px; font:inherit; color:var(--primary); text-decoration:underline; text-underline-offset:3px; cursor:pointer; text-align:left; }
.linkbtn[aria-pressed="true"] { font-weight:600; color:var(--ink); }
.ai-draft { border-left:4px solid var(--review); }
input[type="checkbox"] { width:24px; height:24px; accent-color:var(--primary); flex:none; }
</style>
</head>

        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); cur = '';
        if (row.some(x => x.trim() !== '')) rows.push(row);
        row = [];
      } else cur += c;
    }
    row.push(cur);
    if (row.some(x => x.trim() !== '')) rows.push(row);
    return rows;
  }
  function toTable(text) {
    const rows = parseCSV(text);
    if (rows.length < 2) throw new CzError('EMPTY_FILE', 'The file has no data rows.');
    const headers = rows[0].map(h => h.trim());
    return { headers, rows: rows.slice(1).map((cells, i) => ({ sourceRow: i + 2, cells })) };
  }
  const NULLS = new Set(['', 'na', 'n/a', 'nan', 'null', 'none']);
  /* returns {v:number|null, bad:boolean}. Missing -> null. Text or non-finite -> null with bad=true. */
  function parseNum(s) {
    const t = String(s == null ? '' : s).trim();
    if (NULLS.has(t.toLowerCase())) return { v: null, bad: false };
    const v = Number(t);
    return Number.isFinite(v) ? { v, bad: false } : { v: null, bad: true };
  }

  /* ---------- E1: blood (OSD-575 CMP) ---------- */
  /* Real OSD-575 format: {Participant}_{specimen}_{Visit}, e.g. C001_serum_L-3.
     Fallback accepts simpler names such as C001_L-92. L must carry "-", R must carry "+". */
  const SAMPLE_RE = /^(C\d{3})_([A-Za-z]+)_([LR])([-+])(\d+)$/;
  function parseSampleName(name) {
    const s = String(name || '').replace(/^\uFEFF/, '').trim();
    let p, side, sign, days, specimen = null;
    const m = s.match(SAMPLE_RE);
    if (m) { p = m[1]; specimen = m[2]; side = m[3]; sign = m[4]; days = m[5]; }
    else {
      const pm = s.match(/C\d{3}/);
      const v = s.match(/(?:^|[^A-Za-z0-9])([LR])\s*([-+]?)\s*(\d+)(?![0-9])/);
      if (!pm || !v) return null;
      p = pm[0]; side = v[1]; sign = v[2]; days = v[3];
    }
    if (sign && sign !== (side === 'L' ? '-' : '+')) return null;
    days = parseInt(days, 10);
    return { participant: p, specimen, visit: side === 'L' ? 'L-' + days : 'R+' + days, phase: side === 'L' ? 'pre' : 'post', relDay: side === 'L' ? -days : days };
  }

  function ingestBlood(text) {
    const t = toTable(text);
    const col = {}; t.headers.forEach((h, i) => { if (!(h in col)) col[h] = i; });
    if (!('Sample Name' in col)) throw new CzError('MISSING_COLUMN', 'Missing column "Sample Name". This does not look like the OSD-575 CMP file.', { column: 'Sample Name' });
    const missing = [];
    MARKERS.forEach(m => { if (!(`${m.id}_value_${m.srcUnit}` in col)) missing.push(`${m.id}_value_${m.srcUnit}`); });
    if (missing.length) throw new CzError('MISSING_COLUMN', 'Missing marker columns: ' + missing.join(', '), { columns: missing });

    const obs = [], samples = [], seen = new Set(), unparsed = [], badValues = [];
    t.rows.forEach(r => {
      const name = (r.cells[col['Sample Name']] || '').trim();
      const ps = parseSampleName(name);
      if (!ps) { unparsed.push(name || '(blank)'); return; }
      const sampleKey = name;
      if (seen.has(sampleKey)) throw new CzError('DUPLICATE_SAMPLE', 'Sample appears twice: ' + name, { sample: name });
      seen.add(sampleKey);
      samples.push({ sample: name, participant: ps.participant, visit: ps.visit, phase: ps.phase, relDay: ps.relDay, sourceRow: r.sourceRow });
      MARKERS.forEach(m => {
        const val = parseNum(r.cells[col[`${m.id}_value_${m.srcUnit}`]]);
        const mn = parseNum(r.cells[col[`${m.id}_range_min_${m.srcUnit}`]]);
        const mx = parseNum(r.cells[col[`${m.id}_range_max_${m.srcUnit}`]]);
        if (val.bad || mn.bad || mx.bad) badValues.push(`${name} ${m.id}`);
        obs.push({
          id: `${ps.participant}|${ps.visit}|${m.id}`, sourceRow: r.sourceRow, sampleName: name,
          participant: ps.participant, visit: ps.visit, phase: ps.phase, relDay: ps.relDay,
          marker: m.id, value: val.v, unit: m.unit, rangeLow: mn.v, rangeHigh: mx.v
        });
      });
    });
    if (unparsed.length) {
      throw new CzError('UNPARSED_SAMPLE_NAME', `Could not read participant and visit from ${unparsed.length} sample name(s), for example "${unparsed[0]}". Expected something like C001 and L-92 or R+1.`, { examples: unparsed.slice(0, 5) });
    }
    const participants = {};
    samples.forEach(s => { (participants[s.participant] = participants[s.participant] || []).push(s); });
    Object.values(participants).forEach(a => a.sort((x, y) => x.relDay - y.relDay));
    const visitSet = new Map(); samples.forEach(s => visitSet.set(s.visit, s.relDay));
    const visits = [...visitSet.entries()].sort((a, b) => a[1] - b[1]).map(e => e[0]);
    const perMarker = {}; MARKERS.forEach(m => { perMarker[m.id] = obs.filter(o => o.marker === m.id && o.value != null).length; });
    return {
      kind: 'health', observations: obs, participants, participantIds: Object.keys(participants).sort(), visits,
      quality: {
        rows: t.rows.length, columns: t.headers.length, participants: Object.keys(participants).length, visits: visits.length,
        nonmissingByMarker: perMarker, nonmissingTotal: Object.values(perMarker).reduce((a, b) => a + b, 0),
        invalidValuesTreatedAsMissing: badValues.length, invalidExamples: badValues.slice(0, 5)
      }
    };
  }

  /* ---------- E2: health comparisons ---------- */
  function baselineFor(ds, participant, marker) {
    const vals = ds.observations.filter(o => o.participant === participant && o.marker === marker && o.phase === 'pre' && o.value != null);
    if (vals.length < 2) return { n: vals.length, mean: null, values: vals.map(o => o.value), visits: vals.map(o => o.visit) };
    const mean = vals.reduce((a, o) => a + o.value, 0) / vals.length;
    return { n: vals.length, mean, values: vals.map(o => o.value), visits: vals.map(o => o.visit) };
  }
  function rangeStatus(value, lo, hi) {
    if (value == null) return { status: 'NO_VALUE', oneSided: false };
    if (lo == null && hi == null) return { status: 'UNKNOWN', oneSided: false };
    const oneSided = lo == null || hi == null;
    if (lo != null && value < lo) return { status: 'BELOW', oneSided };
    if (hi != null && value > hi) return { status: 'ABOVE', oneSided };
    return { status: 'WITHIN', oneSided };
  }
  function compare(value, baseline) {
    if (value == null || baseline == null || baseline.mean == null) return { delta: null, pct: null };
    const delta = value - baseline.mean;
    const pct = baseline.mean !== 0 ? 100 * delta / baseline.mean : null;
    return { delta, pct };
  }
  function healthCards(ds, participant, visit) {
    return MARKERS.map(m => {
      const o = ds.observations.find(x => x.participant === participant && x.visit === visit && x.marker === m.id);
      const b = baselineFor(ds, participant, m.id);
      if (!o) return { marker: m.id, label: m.label, unit: m.unit, dp: m.dp, available: false, status: 'NO_VALUE', baseline: b };
      const rs = rangeStatus(o.value, o.rangeLow, o.rangeHigh);
      const c = compare(o.value, b);
      return {
        marker: m.id, label: m.label, unit: m.unit, dp: m.dp, available: o.value != null, obs: o,
        value: o.value, rangeLow: o.rangeLow, rangeHigh: o.rangeHigh, status: rs.status, oneSided: rs.oneSided,
        baseline: b, delta: c.delta, pct: c.pct, phase: o.phase, visit: o.visit, findingKey: findingKey('health', o.id)
      };
    });
  }
  function healthTrend(ds, participant, marker) {
    const m = MARKERS.find(x => x.id === marker);
    const list = (ds.participants[participant] || []).map(s => {
      const o = ds.observations.find(x => x.participant === participant && x.visit === s.visit && x.marker === marker);
      const rs = o ? rangeStatus(o.value, o.rangeLow, o.rangeHigh) : { status: 'NO_VALUE' };
      return { visit: s.visit, phase: s.phase, obs: o, value: o ? o.value : null, rangeLow: o ? o.rangeLow : null, rangeHigh: o ? o.rangeHigh : null, status: rs.status };
    });
    const withR = list.filter(p => p.value != null);
    const lows = new Set(withR.map(p => p.rangeLow)), highs = new Set(withR.map(p => p.rangeHigh));
    const consistent = withR.length > 0 && lows.size === 1 && highs.size === 1;
    const b = baselineFor(ds, participant, marker);
    list.forEach(p => { const c = compare(p.value, b); p.delta = c.delta; p.pct = c.pct; });
    return { marker, label: m.label, unit: m.unit, dp: m.dp, points: list, baseline: b, rangeConsistent: consistent };
  }
  function findingKey(kind, id) { return `${kind}:${id}:${RULE_VERSION}`; }

  /* ---------- E1/E3: radiation ---------- */
  function ingestRadiation(text, opts) {
    opts = opts || {};
    const t = toTable(text);
    const col = {}; t.headers.forEach((h, i) => { if (!(h in col)) col[h] = i; });
    if (!('timestamp' in col) || !('absorbed_dose_rate' in col)) {
      throw new CzError('MISSING_COLUMN', 'Missing "timestamp" or "absorbed_dose_rate". This does not look like a RadLab CSV export.', { columns: t.headers.slice(0, 12) });
    }
    const hasInst = 'instrument_id' in col;
    const instruments = hasInst ? [...new Set(t.rows.map(r => (r.cells[col.instrument_id] || '').trim()).filter(Boolean))].sort() : [];
    const instrument = opts.instrument || (instruments.includes('DosTel1') ? 'DosTel1' : (instruments[0] || 'unknown'));
    const spacecraft = ('spacecraft' in col) ? ([...new Set(t.rows.map(r => (r.cells[col.spacecraft] || '').trim()).filter(Boolean))][0] || null) : null;

    const rows = [];
    let invalidTs = 0, invalidRate = 0;
    t.rows.forEach(r => {
      if (hasInst && (r.cells[col.instrument_id] || '').trim() !== instrument) return;
      const ts = (r.cells[col.timestamp] || '').trim();
      const ms = Date.parse(ts + (/[zZ]|[+-]\d\d:?\d\d$/.test(ts) ? '' : 'Z'));
      if (!ts || !Number.isFinite(ms)) { invalidTs++; return; }
      const pr = parseNum(r.cells[col.absorbed_dose_rate]);
      if (pr.bad) invalidRate++;
      rows.push({ sourceRow: r.sourceRow, ts, ms, rate: pr.v, status: 'OK' });
    });
    if (!rows.length) throw new CzError('NO_ROWS', `No usable rows for instrument ${instrument}.`, { instruments });

    const groups = new Map();
    rows.forEach(r => { (groups.get(r.ms) || groups.set(r.ms, []).get(r.ms)).push(r); });
    const conflictGroups = []; let identicalDupExtras = 0;
    const series = [];
    [...groups.keys()].sort((a, b) => a - b).forEach(ms => {
      const g = groups.get(ms);
      if (g.length > 1) {
        const vals = g.map(x => x.rate);
        const allSame = vals.every(v => v != null && v === vals[0]);
        if (!allSame) {
          g.forEach(x => { x.status = 'CONFLICT'; });
          conflictGroups.push({ ts: g[0].ts, ms, rows: g.map(x => ({ sourceRow: x.sourceRow, rate: x.rate })) });
          series.push({ ms, ts: g[0].ts, rate: null, status: 'CONFLICT', sourceRow: g[0].sourceRow });
          return;
        }
        g.slice(1).forEach(x => { x.status = 'DUPLICATE_IDENTICAL'; identicalDupExtras++; });
      }
      const keep = g[0];
      if (keep.rate == null) { keep.status = 'INVALID'; series.push({ ms, ts: keep.ts, rate: null, status: 'INVALID', sourceRow: keep.sourceRow }); }
      else series.push({ ms, ts: keep.ts, rate: keep.rate, status: 'OK', sourceRow: keep.sourceRow });
    });
    const quarantined = rows.filter(r => r.status === 'CONFLICT').length;
    return {
      kind: 'radiation', instrument, instruments, spacecraft, rows, series, conflictGroups,
      quality: {
        fileRows: t.rows.length, instrumentRows: rows.length, uniqueTimestamps: groups.size,
        conflictGroups: conflictGroups.length, quarantinedRows: quarantined, identicalDuplicateRows: identicalDupExtras,
        invalidRateRows: rows.filter(r => r.status === 'INVALID').length, invalidTimestampRows: invalidTs,
        unambiguousRows: rows.length - quarantined - identicalDupExtras - rows.filter(r => r.status === 'INVALID').length,
        first: series[0].ts, last: series[series.length - 1].ts
      }
    };
  }

  /* Trapezoid per accepted interval. series items: {ms, rate, status}. */
  function integrate(series, opts) {
    const maxGap = (opts && opts.maxGapS) || DEFAULT_MAX_GAP_S;
    const s = [...series].sort((a, b) => a.ms - b.ms);
    const intervals = []; let total = 0, covered = 0;
    for (let k = 0; k + 1 < s.length; k++) {
      const a = s[k], b = s[k + 1];
      const dt = (b.ms - a.ms) / 1000;
      let reason = null;
      if (a.status === 'CONFLICT' || b.status === 'CONFLICT') reason = 'conflict';
      else if (a.status !== 'OK' || b.status !== 'OK' || !Number.isFinite(a.rate) || !Number.isFinite(b.rate)) reason = 'invalid';
      else if (dt <= 0) reason = 'order';
      else if (dt > maxGap) reason = 'gap';
      const accepted = reason === null;
      const dose = accepted ? ((a.rate + b.rate) / 2) * (dt / 3600) : 0;
      if (accepted) { total += dose; covered += dt; }
      intervals.push({ from: a.ms, to: b.ms, fromTs: a.ts, toTs: b.ts, dtS: dt, accepted, reason, dose, cumulative: total });
    }
    return { intervals, totalDose: total, coveredSeconds: covered, maxGapS: maxGap, excluded: intervals.filter(i => !i.accepted) };
  }

  /* ---------- review store (idempotent, versioned, audit trail) ---------- */
  const STATUSES = ['OPEN', 'FOLLOW_UP_REQUESTED', 'REVIEWED'];
  function createReviewStore(storage, key) {
    key = key || 'cz.reviews.v1';
    let state = { reviews: [], events: [], seq: 0 };
    try { const raw = storage && storage.getItem(key); if (raw) { const p = JSON.parse(raw); if (p && Array.isArray(p.reviews) && Array.isArray(p.events)) state = p; } } catch (e) {}
    function persist() {
      try { if (storage) storage.setItem(key, JSON.stringify(state)); }
      catch (e) { throw new CzError('SAVE_FAILED', 'Could not save to this browser. Your draft is still on screen. Try again.', {}); }
    }
    function event(reviewId, action, before, after) { state.events.push({ id: ++state.seq, reviewId, action, before, after, timestamp: new Date().toISOString() }); }
    return {
      list() { return state.reviews.map(r => ({ ...r })); },
      events() { return state.events.map(e => ({ ...e })); },
      byFinding(k) { const r = state.reviews.find(x => x.findingKey === k); return r ? { ...r } : null; },
      /* create or open: same findingKey returns the existing review, never a duplicate */
      create(finding) {
        const ex = state.reviews.find(x => x.findingKey === finding.findingKey);
        if (ex) return { review: { ...ex }, created: false };
        const now = new Date().toISOString();
        const r = { id: 'rev-' + (++state.seq), findingKey: finding.findingKey, kind: finding.kind, title: finding.title, subject: finding.subject,
          participant: finding.participant || null, instrument: finding.instrument || null, summary: finding.summary || '',
          evidence: finding.evidence || null, status: 'OPEN', note: '', followUpDate: null, createdAt: now, updatedAt: now, version: 1 };
        state.reviews.unshift(r); event(r.id, 'CREATED', null, { status: r.status });
        persist();
        return { review: { ...r }, created: true };
      },
      update(id, patch, expectedVersion) {
        const r = state.reviews.find(x => x.id === id);
        if (!r) throw new CzError('NOT_FOUND', 'Review not found.', {});
        if (expectedVersion != null && expectedVersion !== r.version) throw new CzError('VERSION_CONFLICT', 'This review changed since you opened it. Reload it and try again.', { current: r.version });
        if (patch.status && !STATUSES.includes(patch.status)) throw new CzError('VALIDATION', 'Unknown status.', {});
        const before = { status: r.status, note: r.note, followUpDate: r.followUpDate };
        if (patch.status !== undefined) r.status = patch.status;
        if (patch.note !== undefined) r.note = String(patch.note).slice(0, 4000);
        if (patch.followUpDate !== undefined) r.followUpDate = patch.followUpDate || null;
        r.version += 1; r.updatedAt = new Date().toISOString();
        event(r.id, 'UPDATED', before, { status: r.status, note: r.note, followUpDate: r.followUpDate });
        persist();
        return { ...r };
      },
      clearAll() { state = { reviews: [], events: [], seq: 0 }; persist(); }
    };
  }

  /* ---------- export packet ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function buildPacket(ctx) {
    const reviews = ctx.reviews;
    return {
      title: 'CytoZoe review packet', exportedAt: new Date().toISOString(), ruleVersion: RULE_VERSION,
      notice: 'Local download only. Not transmitted anywhere. Historical research data; not a clinical record and not medical advice.',
      health: {
        source: ctx.health ? ctx.health.source : null,
        reviews: reviews.filter(r => r.kind === 'health')
      },
      environment: {
        source: ctx.radiation ? ctx.radiation.source : null,
        reviews: reviews.filter(r => r.kind === 'environment')
      },
      formulas: [
        'Baseline = mean of available preflight (L-) values for the same participant and marker; needs at least 2 values.',
        'Delta = value - baseline. Percent = 100 x (value - baseline) / baseline, only when baseline is not 0.',
        'Range status: below if value < lower bound, above if value > upper bound; equality is inside. Missing bounds give one-sided or UNKNOWN.',
        'Interval dose (uGy) = ((rate_i + rate_j) / 2) x (seconds between readings / 3600), only for adjacent unambiguous readings no more than ' + DEFAULT_MAX_GAP_S + ' s apart.'
      ],
      limits: [
        'The health and radiation records are separate cases. They are not paired and no exposure-health relationship is claimed.',
        'Four people are not a clinical validation cohort. Baseline changes are descriptive, not abnormality thresholds.',
        'Estimated dose is at the sensor over covered intervals only. It is not personal dose, organ dose or risk.',
        'The 300 s gap rule is an engineering coverage rule, not a NASA health threshold.'
      ]
    };
  }
  function packetHTML(p) {
    const rev = r => `<tr><td>${esc(r.title)}</td><td>${esc(r.subject)}</td><td>${esc(r.status)}</td><td>${esc(r.followUpDate || '')}</td><td>${esc(r.note)}</td><td>${esc(r.updatedAt)}</td></tr>`;
    const src = s => s ? `<p>Source file: ${esc(s.fileName)} &middot; SHA-256 <code>${esc(s.sha256)}</code> &middot; imported ${esc(s.importedAt)}</p>${s.url ? `<p>Public source: ${esc(s.url)}</p>` : ''}${s.quality ? `<p>Data quality: ${esc(s.quality)}</p>` : ''}` : '<p>No dataset loaded.</p>';
    const table = list => list.length ? `<table><thead><tr><th>Finding</th><th>Subject</th><th>Status</th><th>Follow-up date</th><th>Note</th><th>Updated</th></tr></thead><tbody>${list.map(rev).join('')}</tbody></table>` : '<p>No saved reviews in this section.</p>';
    return `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>${esc(p.title)}</title><style>body{font:15px/1.5 system-ui,sans-serif;max-width:900px;margin:32px auto;padding:0 16px;color:#14283F}h1{font-size:28px}h2{margin-top:32px;border-bottom:1px solid #DCE4EB;padding-bottom:6px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #DCE4EB;padding:6px 8px;text-align:left;vertical-align:top;font-size:13px}code{word-break:break-all}.n{background:#FFF3DF;color:#9A4B08;padding:8px 12px;border-radius:8px}</style></head><body><h1>${esc(p.title)}</h1><p>Exported ${esc(p.exportedAt)} &middot; rules ${esc(p.ruleVersion)}</p><p class="n">${esc(p.notice)}</p><h2>Health review (historical blood samples)</h2>${src(p.health.source)}${table(p.health.reviews)}<h2>Environment review (separate radiation case)</h2>${src(p.environment.source)}${table(p.environment.reviews)}<h2>Formulas</h2><ul>${p.formulas.map(f => `<li>${esc(f)}</li>`).join('')}</ul><h2>Limits</h2><ul>${p.limits.map(f => `<li>${esc(f)}</li>`).join('')}</ul></body></html>`;
  }
  function reviewsCSV(list) {
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const head = ['id', 'case', 'finding', 'subject', 'participant_or_instrument', 'status', 'follow_up_date', 'note', 'created_at', 'updated_at'];
    return [head.join(',')].concat(list.map(r => [r.id, r.kind, r.title, r.subject, r.participant || r.instrument || '', r.status, r.followUpDate || '', r.note, r.createdAt, r.updatedAt].map(q).join(','))).join('\n');
  }

  /* ---------- verified explanation templates (deterministic; no generative model) ---------- */
  const fmt = (v, dp) => v == null ? 'n/a' : Number(v).toFixed(dp);
  function explainHealth(card, question) {
    const q = String(question || '').toLowerCase();
    const o = card.obs;
    if (isUnsupported(q)) return unsupportedReply();
    if (q === 'how') {
      return { mode: 'Verified explanation', sourceIds: [o.id], title: 'How this was calculated', paragraphs: [
        `Value: ${fmt(card.value, card.dp + 1)} ${card.unit} from source row ${o.sourceRow}, sample ${o.sampleName}.`,
        card.baseline.mean == null ? `Baseline: not available (needs at least 2 preflight values; this participant has ${card.baseline.n}).` :
          `Baseline = mean of ${card.baseline.n} preflight values (${card.baseline.values.join(', ')}) = ${fmt(card.baseline.mean, 4)} ${card.unit}.`,
        card.delta == null ? 'Delta: not available.' : `Delta = ${fmt(card.value, 4)} - ${fmt(card.baseline.mean, 4)} = ${fmt(card.delta, 4)} ${card.unit}${card.pct == null ? '' : ` (${fmt(card.pct, 2)}%)`}.`,
        `Range check: lower ${card.rangeLow == null ? 'n/a' : card.rangeLow}, upper ${card.rangeHigh == null ? 'n/a' : card.rangeHigh}. Strictly below the lower or above the upper bound counts as outside; equal counts as inside.`,
        'Displayed numbers are rounded. The comparisons use the unrounded source values.'
      ] };
    }
    if (q === 'limits') {
      return { mode: 'Verified explanation', sourceIds: [o.id], title: 'What this dataset cannot tell us', paragraphs: [
        'It has four participants and seven visits each. That is a small descriptive sample, not a clinical validation cohort.',
        'A difference from baseline has many possible causes. It is not an abnormality threshold and it does not show that spaceflight caused it.',
        card.phase === 'pre' ? 'This is a preflight sample, so a value outside the supplied range here cannot be a spaceflight effect.' : 'This is a post-return sample. The preflight baseline is retrospective, calculated from all preflight visits.',
        'The radiation case is a separate record. It is not paired with these people.'
      ] };
    }
    const where = card.status === 'ABOVE' ? 'above the supplied upper bound' : card.status === 'BELOW' ? 'below the supplied lower bound' : card.status === 'WITHIN' ? 'within the supplied range' : 'without supplied bounds to compare against';
    return { mode: 'Verified explanation', sourceIds: [o.id], title: 'Explain this result', paragraphs: [

  /* ---------- drawer ---------- */
  let lastOpener = null;

    const t = document.getElementById('drawer-title'); if (t) t.focus();
  }
  function closeDrawer() { S.drawer = null; renderDrawer(); setInert(false); if (lastOpener && document.contains(lastOpener)) lastOpener.focus(); render(); }
  function setInert(on) { const r = document.getElementById('root'); if (!r) return; if (on) { r.setAttribute('inert', ''); r.setAttribute('aria-hidden', 'true'); } else { r.removeAttribute('inert'); r.removeAttribute('aria-hidden'); } }
  function trapTab(e) {
    if (e.key !== 'Tab') return;
    const f = [...e.currentTarget.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return; const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement.id === 'drawer-title')) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }

  /* ---------- charts ---------- */
  function niceTicks(lo, hi, n) {
    const span = hi - lo || 1, raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
    const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
    const out = []; for (let t = Math.ceil(lo / step - 1e-9) * step; ; t += step) { out.push(+t.toFixed(10)); if (t >= hi - step * 1e-6) break; }
    return out;
  }
  function registerChart(el, draw) { S.charts.push({ el, draw }); }
  function drawAll() { S.charts.forEach(c => { if (document.contains(c.el)) c.draw(c.el); }); }

  function healthChart(trend, selectedVisit) {
    const box = h('div', { class: 'chart' });
    const draw = (el) => {
      const W = Math.max(280, el.clientWidth || 600), H = W < 520 ? 300 : 340, m = { l: 56, r: 20, t: 20, b: 48 };
      const pts = trend.points;
      const vals = pts.filter(p => p.value != null).map(p => p.value);
      let lo = Math.min(...vals), hi = Math.max(...vals);
      pts.forEach(p => { if (p.rangeLow != null) lo = Math.min(lo, p.rangeLow); if (p.rangeHigh != null) hi = Math.max(hi, p.rangeHigh); });
      if (trend.baseline.mean != null) { lo = Math.min(lo, trend.baseline.mean); hi = Math.max(hi, trend.baseline.mean); }
      const pad = (hi - lo) * 0.12 || Math.abs(hi) * 0.1 || 1; lo -= pad; hi += pad;
      const X = i => m.l + (pts.length === 1 ? (W - m.l - m.r) / 2 : i * (W - m.l - m.r) / (pts.length - 1));
      const Y = v => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
      const svg = s('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'group', 'aria-label': `${trend.label} by visit. Dots are actual samples. A table with every value follows the chart.` });
      niceTicks(lo, hi, 5).forEach(t => {
        svg.append(s('line', { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: '#DCE4EB' }), s('text', { x: m.l - 8, y: Y(t) + 4, 'text-anchor': 'end' }, num(t, trend.dp > 0 ? Math.min(trend.dp + 1, 2) : 0)));
      });
      svg.append(s('text', { x: 14, y: m.t + 8, transform: `rotate(-90 14 ${m.t + 8})`, 'text-anchor': 'end' }, trend.unit));
      if (trend.rangeConsistent) {
        const p0 = pts.find(p => p.value != null);
        if (p0.rangeLow != null && p0.rangeHigh != null) svg.append(s('rect', { x: m.l, y: Y(p0.rangeHigh), width: W - m.l - m.r, height: Y(p0.rangeLow) - Y(p0.rangeHigh), fill: '#E8F5F5' }));
        else {
          if (p0.rangeLow != null) svg.append(s('line', { x1: m.l, x2: W - m.r, y1: Y(p0.rangeLow), y2: Y(p0.rangeLow), stroke: '#087F8C', 'stroke-dasharray': '2 4' }));
          if (p0.rangeHigh != null) svg.append(s('line', { x1: m.l, x2: W - m.r, y1: Y(p0.rangeHigh), y2: Y(p0.rangeHigh), stroke: '#087F8C', 'stroke-dasharray': '2 4' }));
        }
      } else {
        pts.forEach((p, i) => { if (p.rangeLow != null && p.rangeHigh != null) svg.append(s('line', { x1: X(i), x2: X(i), y1: Y(p.rangeLow), y2: Y(p.rangeHigh), stroke: '#728297', 'stroke-width': 2 }), s('line', { x1: X(i) - 5, x2: X(i) + 5, y1: Y(p.rangeLow), y2: Y(p.rangeLow), stroke: '#728297', 'stroke-width': 2 }), s('line', { x1: X(i) - 5, x2: X(i) + 5, y1: Y(p.rangeHigh), y2: Y(p.rangeHigh), stroke: '#728297', 'stroke-width': 2 })); });
      }
      if (trend.baseline.mean != null) {
        svg.append(s('line', { x1: m.l, x2: W - m.r, y1: Y(trend.baseline.mean), y2: Y(trend.baseline.mean), stroke: '#64748B', 'stroke-width': 2, 'stroke-dasharray': '6 5' }),
          s('text', { x: W - m.r, y: Y(trend.baseline.mean) - 6, 'text-anchor': 'end' }, 'Preflight mean ' + num(trend.baseline.mean, 2)));
      }
      const firstPost = pts.findIndex(p => p.phase === 'post');
      if (firstPost > 0) { const xb = (X(firstPost - 1) + X(firstPost)) / 2; svg.append(s('line', { x1: xb, x2: xb, y1: m.t, y2: H - m.b, stroke: '#728297', 'stroke-dasharray': '2 4' }), s('text', { x: xb - 6, y: H - m.b - 6, 'text-anchor': 'end' }, 'Before launch'), s('text', { x: xb + 6, y: H - m.b - 6 }, 'After return')); }
      pts.forEach((p, i) => {
        svg.append(s('text', { x: X(i), y: H - m.b + 20, 'text-anchor': 'middle', 'font-weight': p.visit === selectedVisit ? 700 : 400, fill: p.visit === selectedVisit ? '#14283F' : null }, p.visit));
        if (p.value == null) return;
        const out = p.status === 'ABOVE' || p.status === 'BELOW', sel = p.visit === selectedVisit;
        const g = s('g', { class: 'pt', tabindex: 0, role: 'button', 'aria-label': `${p.visit}: ${num(p.value, trend.dp + 1)} ${trend.unit}, ${out ? 'outside supplied range' : 'not outside supplied range'}${sel ? ', selected' : ''}`, style: 'cursor:pointer' });
        if (sel) g.append(s('circle', { cx: X(i), cy: Y(p.value), r: 13, fill: 'none', stroke: '#087F8C', 'stroke-width': 2 }));
        g.append(out ? s('path', { d: `M${X(i)} ${Y(p.value) - 9} L${X(i) + 9} ${Y(p.value)} L${X(i)} ${Y(p.value) + 9} L${X(i) - 9} ${Y(p.value)} Z`, fill: '#9A4B08', stroke: '#fff', 'stroke-width': 2 }) : s('circle', { cx: X(i), cy: Y(p.value), r: 7, fill: '#087F8C', stroke: '#fff', 'stroke-width': 2 }));
        g.append(s('title', {}, `${p.visit}: ${num(p.value, trend.dp + 1)} ${trend.unit}`));
        const pick = () => { S.ui.visit = p.visit; render(); };
        g.addEventListener('click', pick); g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
        svg.append(g);
      });
      el.replaceChildren(svg);
    };
    registerChart(box, draw);
    return h('div', {}, box, h('div', { class: 'legend' },
      h('span', {}, svgIcon('circle'), ' Measured sample'), h('span', {}, svgIcon('diamond'), ' Measured, outside supplied range'),
      h('span', {}, svgIcon('dash'), ' Calculated preflight mean'), h('span', {}, svgIcon('band'), ' Supplied range (source)')));
  }
  function svgIcon(kind) {
    const el = s('svg', { width: 22, height: 14, viewBox: '0 0 22 14', 'aria-hidden': 'true' });
    if (kind === 'circle') el.append(s('circle', { cx: 11, cy: 7, r: 5, fill: '#087F8C' }));
    if (kind === 'diamond') el.append(s('path', { d: 'M11 1 L17 7 L11 13 L5 7 Z', fill: '#9A4B08' }));
    if (kind === 'dash') el.append(s('line', { x1: 1, x2: 21, y1: 7, y2: 7, stroke: '#64748B', 'stroke-width': 2, 'stroke-dasharray': '5 4' }));
    if (kind === 'band') el.append(s('rect', { x: 1, y: 2, width: 20, height: 10, fill: '#E8F5F5', stroke: '#DCE4EB' }));
    if (kind === 'excl') el.append(s('rect', { x: 1, y: 1, width: 20, height: 12, fill: '#FFF3DF', stroke: '#9A4B08' }));
    if (kind === 'line') el.append(s('line', { x1: 1, x2: 21, y1: 7, y2: 7, stroke: '#087F8C', 'stroke-width': 2 }));

  /* radiation charts: one shared time scale */
  function timeAxis(svg, X, t0, t1, W, H, m) {
    const hrs = (t1 - t0) / 3.6e6, step = hrs > 12 ? 3 : hrs > 6 ? 2 : 1;
    const start = new Date(t0); start.setUTCMinutes(0, 0, 0);

  }

  function download(name, mime, content) {
    const url = URL.createObjectURL(new Blob([content], { type: mime }));
    const a = h('a', { href: url, download: name }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  function currentPacket() {
    return CZ.buildPacket({ reviews: store.list(),
      health: S.meta.health ? { source: { ...S.meta.health, quality: S.health ? `${S.health.quality.rows} samples, ${S.health.quality.nonmissingTotal} marker values` : '' } } : null,
      radiation: S.meta.radiation ? { source: { ...S.meta.radiation, quality: S.radiation ? `${S.radiation.quality.instrumentRows} rows, ${S.radiation.quality.conflictGroups} conflicting timestamp group(s), ${S.radiation.quality.quarantinedRows} rows excluded` : '' } } : null });
  }
  function pageReviews() {
    const all = store.list();
    const F = S.filters;
    const parts = [...new Set(all.filter(r => r.participant).map(r => r.participant))].sort();
    const list = all.filter(r => (F.kind === 'all' || r.kind === F.kind) && (F.status === 'all' || r.status === F.status) && (F.participant === 'all' || r.participant === F.participant));
    const sel = (id, label, val, opts, on) => h('label', { class: 'lbl', for: id }, label, (() => { const e = h('select', { class: 'field', id, 'data-fid': id, on: { change: ev => { on(ev.target.value); render(); } } }, ...opts.map(([v, t]) => h('option', { value: v }, t))); e.value = val; return e; })());
    const filters = h('div', { class: 'card' }, h('div', { class: 'row' },
      sel('f-kind', 'Case', F.kind, [['all', 'All'], ['health', 'Health'], ['environment', 'Environment']], v => { F.kind = v; if (v === 'environment') F.participant = 'all'; }),
      sel('f-status', 'Status', F.status, [['all', 'All'], ...CZ.STATUSES.map(x => [x, x.replace(/_/g, ' ').toLowerCase()])], v => { F.status = v; }),
      F.kind !== 'environment' ? sel('f-part', 'Participant (health only)', F.participant, [['all', 'All'], ...parts.map(p => [p, p])], v => { F.participant = v; }) : null,
      h('button', { class: 'btn primary', type: 'button', 'data-fid': 'export', on: { click: () => { S.packetOpen = !S.packetOpen; render(); } } }, S.packetOpen ? 'Hide export preview' : 'Export review packet')));
    const table = list.length ? h('div', { class: 'table-wrap' }, h('table', {}, h('thead', {}, h('tr', {}, ...['Finding', 'Case', 'Participant / instrument', 'Status', 'Updated'].map(x => h('th', { scope: 'col' }, x)))),
      h('tbody', {}, ...list.map(r => h('tr', { class: 'click', 'data-selected': String(S.selectedReview === r.id), 'data-fid': 'row-' + r.id, on: { click: e => { if (e.target.closest('button')) return; S.selectedReview = r.id; render(); } } },
        h('td', {}, h('button', { class: 'linkbtn', type: 'button', 'data-fid': 'open-' + r.id, 'aria-pressed': String(S.selectedReview === r.id), on: { click: () => { S.selectedReview = r.id; render(); const d = document.getElementById('rv-note'); if (d) d.focus(); } } }, r.title)), h('td', {}, r.kind), h('td', {}, r.participant || r.instrument || ''), h('td', {}, r.status.replace(/_/g, ' ').toLowerCase()), h('td', {}, when(r.updatedAt))))))) :
      h('div', { class: 'empty' }, h('p', {}, all.length ? 'No reviews match these filters.' : 'No follow-ups saved yet. Open a result from Health overview, Health trends or Radiation review and choose Save follow-up.'));
    const sr = all.find(r => r.id === S.selectedReview);
    const detail = sr ? h('aside', { class: 'card' }, h('h2', {}, sr.title), h('p', { class: 'small muted' }, `${sr.subject} · created ${when(sr.createdAt)}`), h('p', { style: 'margin:8px 0' }, sr.summary),
      reviewForm({ findingKey: sr.findingKey }, () => {}),
      h('h3', { style: 'margin-top:16px' }, 'History'),
      h('ul', { class: 'list' }, ...store.events().filter(e => e.reviewId === sr.id).reverse().map(e => h('li', {}, h('span', { class: 'small' }, e.action.toLowerCase() + (e.after && e.after.status ? ' · ' + e.after.status.replace(/_/g, ' ').toLowerCase() : '')), h('span', { class: 'meta' }, when(e.timestamp)))))) : null;
    const pk = currentPacket();
    const preview = S.packetOpen ? h('section', { class: 'card' }, h('h2', {}, 'Review packet preview'),
      h('p', { class: 'small muted', style: 'margin:8px 0 12px' }, `Includes ${pk.health.reviews.length} health and ${pk.environment.reviews.length} environment review(s), source identity, formulas and limits. Download saves a local file. Nothing is sent anywhere.`),
      h('div', { class: 'row', style: 'margin-bottom:12px' },
        h('button', { class: 'btn primary', type: 'button', 'data-fid': 'dl-html', on: { click: () => download('cytozoe-review-packet.html', 'text/html', CZ.packetHTML(currentPacket())) } }, 'Download HTML'),
        h('button', { class: 'btn', type: 'button', 'data-fid': 'dl-json', on: { click: () => download('cytozoe-review-packet.json', 'application/json', JSON.stringify(currentPacket(), null, 2)) } }, 'Download JSON'),
        h('button', { class: 'btn', type: 'button', 'data-fid': 'dl-csv', on: { click: () => download('cytozoe-reviews.csv', 'text/csv', CZ.reviewsCSV(store.list())) } }, 'Download CSV')),
      h('iframe', { title: 'Review packet preview', sandbox: '', srcdoc: CZ.packetHTML(pk), style: 'width:100%;height:420px;border:1px solid var(--border);border-radius:10px;background:#fff' })) : null;
    return pageShell('Review log', 'What did we decide to follow up? Saved on this device.', [h('span', { class: 'badge outline' }, 'Saved in this browser')], filters, preview,
      h('div', { class: sr ? 'grid-2-1' : '' }, h('section', { class: 'card' }, h('h2', {}, `Reviews (${list.length})`), h('div', { style: 'margin-top:12px' }, table)), detail));
  }

  function sourceDrawer() {
    const block = (kind, title) => {
      const m = S.meta[kind], ds = S[kind];
      return h('section', { class: 'ev' }, h('h3', {}, title),
        m ? h('div', { class: 'ev' }, h('p', {}, m.fileName), m.bundled ? h('p', { class: 'small' }, 'Bundled copy embedded in this HTML file. ' + (m.verified === true ? '\u2713 SHA-256 re-checked in this browser.' : m.verified === false ? '! SHA-256 check failed.' : 'SHA-256 check pending.')) : null, h('p', { class: 'meta mono' }, 'SHA-256 ' + m.sha256), m.importedAt ? h('p', { class: 'meta' }, 'Imported ' + when(m.importedAt)) : null, h('p', { class: 'meta' }, m.url),
          h('p', { class: 'small' }, m.knownSnapshot ? '✓ Byte-identical to the snapshot inspected for the PRD.' : 'Not byte-identical to the snapshot inspected for the PRD. It is kept as imported; numbers may differ from the PRD examples.'),
          h('p', { class: 'small' }, kind === 'health' ? `${ds.quality.rows} samples · ${ds.quality.participants} participants · ${ds.quality.visits} visits · ${ds.quality.nonmissingTotal} marker values` : `${ds.quality.fileRows} file rows · ${ds.quality.instrumentRows} for ${ds.instrument} · ${ds.quality.conflictGroups} conflicting timestamp groups · ${ds.quality.quarantinedRows} rows excluded · ${ds.quality.unambiguousRows} unambiguous`),
          h('div', { class: 'row' }, h('label', { class: 'lbl', for: 'rep-' + kind }, 'Replace file', h('input', { type: 'file', accept: '.csv', id: 'rep-' + kind, class: 'field', on: { change: e => importFile(kind, e.target.files[0]) } })),
            EMB[kind] && m.bundled ? null : h('button', { class: 'btn', type: 'button', on: { click: () => { removeData(kind); closeDrawer(); } } }, EMB[kind] ? 'Return to bundled NASA file' : 'Remove from this browser')))
          : h('p', {}, 'Not loaded.'));
    };
    return h('div', { class: 'ev' }, block('health', 'Blood panel (OSD-575)'), block('radiation', 'Radiation (RadLab)'),
      h('p', { class: 'meta' }, 'The two records are separate cases. They are not paired.'), aiSettingsBlock());
  }

  /* ---------- shell and routing ---------- */
  const ROUTES = [['overview', 'Health overview', pageOverview], ['health', 'Health trends', pageHealth], ['environment', 'Radiation review', pageEnvironment], ['reviews', 'Review log', pageReviews]];
  function route() { const r = (location.hash || '').replace('#/', ''); return ROUTES.find(x => x[0] === r) || ROUTES[0]; }
  function shell() {
    const cur = route();
    const nav = h('nav', { class: 'nav', 'aria-label': 'Main' }, ...ROUTES.map((r, i) => h('a', { href: '#/' + r[0], 'aria-current': r[0] === cur[0] ? 'page' : null, title: r[1], on: { click: () => document.getElementById('rail').classList.remove('open') } }, h('span', { class: 'num', 'aria-hidden': 'true' }, i + 1), h('span', { class: 'label' }, r[1]))));
    return h('div', { class: 'app' },
      h('a', { class: 'skip', href: '#/' + cur[0], on: { click: e => { e.preventDefault(); const tt = document.getElementById('page-title'); if (tt) tt.focus(); } } }, 'Skip to main content'),
      h('aside', { class: 'rail', id: 'rail' }, h('div', { class: 'wordmark' }, 'CytoZoe', h('small', {}, 'Understand the change. Keep the evidence.')), nav,
        h('div', { class: 'rail-foot' }, h('p', {}, 'Public research demo. Not clinical software.'), h('p', {}, 'Local workspace · saved in this browser'),
          h('button', { class: 'btn', type: 'button', 'data-fid': 'sources', 'aria-label': 'Sources and quality', on: { click: e => openDrawer('Sources and data quality', sourceDrawer, e.currentTarget) } }, h('span', { class: 'label' }, 'Sources & quality')))),
      h('main', { class: 'main', id: 'main' }, h('div', { style: 'margin-bottom:12px' }, h('button', { class: 'btn menu-btn', type: 'button', 'aria-label': 'Open menu', on: { click: () => document.getElementById('rail').classList.toggle('open') } }, 'Menu')), cur[2]()));
  }
  let firstRender = true;
  function render(focusTitle) {
    const active = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fid : null;
    const scrollY = window.scrollY;
    S.charts = [];
    const root = document.getElementById('root'); root.replaceChildren(shell());
    drawAll();
    document.title = route()[1] + ' · CytoZoe';
    if (focusTitle) { const t = document.getElementById('page-title'); if (t) t.focus(); window.scrollTo(0, 0); }
    else {
      if (active) { const el = document.querySelector(`[data-fid="${CSS.escape(active)}"]`); if (el && !el.disabled) el.focus(); }
      window.scrollTo(0, scrollY);
    }
    if (S.drawer) renderDrawer();
    firstRender = false;
  }
  window.addEventListener('hashchange', () => { S.drawer = null; renderDrawer(); setInert(false); render(true); });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawAll, 120); });
  window.addEventListener('beforeunload', () => {});
  loadSaved();
  if (!location.hash) location.hash = '#/overview';
  document.getElementById('drawer-host') || document.body.append(h('div', { id: 'drawer-host' }));
  render();
  verifyBundled();
  window.__CZ_STATE = S; /* exposed for tests */
})();
</script>
